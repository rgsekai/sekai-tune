name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Windows Packages
        working-directory: desktop
        run: |
          .\gradlew.bat packageMsi packageExe windowsPortable --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          name: Sekai Tune Desktop ${{ steps.version.outputs.version }}
          files: |
            desktop/desktopApp/build/distributions/*.msi
            desktop/desktopApp/build/distributions/*.exe
            desktop/desktopApp/build/distributions/*-windows-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
